<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="物序——基于多模态视觉识别的一站式生活数字化助手（网页演示原型）" />
  <title>物序 · 一站式生活数字化助手</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a1a30" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="物序" />
<link rel="stylesheet" href="css/style.css?v=20261019h" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo"></span>
        <div class="brand-text">
          <h1>物序</h1>
          <p>看得见 · 管得住 · 算得清</p>
        </div>
      </div>
      <span class="demo-chip" id="modeChip" title="当前为本地演示数据，未调用真实视觉 API">演示模式</span>
    </div>
  </header>

  <!-- 主视图容器 -->
  <nav class="mainnav" id="mainnav">
    <button class="nav-item" data-view="home" onclick="go('home')">首页</button>
    <button class="nav-item" data-view="items" onclick="go('items')">物品库</button>
    <button class="nav-item" data-view="expiry" onclick="go('expiry')">保质期</button>
    <button class="nav-item" data-view="diet" onclick="go('diet')">饮食</button>
    <button class="nav-item" data-view="profile" onclick="go('profile')">我的</button>
  </nav>

  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  

  <!-- 模态层 -->
  <div id="modal-root"></div>

  <!-- 隐藏文件选择（拍照/相册） -->
  <input type="file" id="fileInput" accept="image/*" hidden />

  <script src="config.js?v=20261019h"></script>
  <script src="js/mock.js?v=20261019h"></script>
  <script src="js/app.js?v=20261019h"></script>
  <script src="js/camera.js?v=20261019h"></script>
  <script src="js/app2.js?v=20261019h"></script>
  <script src="js/cloud.js?v=20261019h"></script>
  <script src="js/ai.js?v=20261019h"></script>
</body>
</html>
